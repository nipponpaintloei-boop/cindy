name: Build CINDY APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install JS dependencies
        run: npm install

      # localStorage inside the WebView is not reliable persistent storage on
      # Android (Capacitor's own docs call it transient — the OS can reclaim
      # it, and it's been reported to clear on app close). This plugin backs
      # our storage shim (storage-shim.js) with real Android SharedPreferences
      # instead, which is what actually survives app restarts.
      - name: Install Capacitor Preferences plugin
        run: npm install @capacitor/preferences

      # Native Google Sign-In (required — Google blocks OAuth popups opened
      # from inside an app's WebView, so the JS-only signInWithPopup flow
      # cannot be used here).
      - name: Install Firebase Authentication plugin
        run: npm install @capacitor-firebase/authentication firebase

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Add google-services.json and Gradle plugin for Firebase Auth
        run: bash ci/patch-firebase.sh

      - name: Generate app icons from resources/
        run: npx capacitor-assets generate --android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Force stable debug signing (keeps app signature stable across builds)
        env:
          CINDY_KEYSTORE_PATH: ${{ github.workspace }}/ci/debug.keystore
        run: bash ci/patch-signing.sh

      # Prints the SHA-1 fingerprint of the stable debug keystore into the
      # build log. Needed once to register under Firebase Console >
      # Project settings > your Android app > Add fingerprint, so Google
      # Sign-In accepts this app. Since the keystore is stable across builds
      # (see step above), you only need to copy this value in one time.
      - name: Print debug keystore SHA-1 (for Firebase Console)
        run: keytool -list -v -keystore ci/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"

      - name: Install Android Home Screen Widget
        run: bash ci/patch-widget.sh

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cindy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
