name: Build CINDY APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Prints the SHA-1 fingerprint of the stable debug keystore into the
      # build log. Needed once to register under Firebase Console >
      # Project settings > your Android app > Add fingerprint, so Google
      # Sign-In accepts this app. Placed early (right after JDK setup) so it
      # still runs even if a later step fails — it only needs the keystore
      # file and keytool, nothing else.
      - name: Print debug keystore SHA-1 (for Firebase Console)
        run: keytool -list -v -keystore ci/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"

      - name: Install JS dependencies
        run: npm install

      # localStorage inside the WebView is not reliable persistent storage on
      # Android (Capacitor's own docs call it transient — the OS can reclaim
      # it, and it's been reported to clear on app close). This plugin backs
      # our storage shim (storage-shim.js) with real Android SharedPreferences
      # instead, which is what actually survives app restarts.
      - name: Install Capacitor Preferences plugin
        run: npm install @capacitor/preferences

      # Native Google Sign-In (required — Google blocks OAuth popups opened
      # from inside an app's WebView, so the JS-only signInWithPopup flow
      # cannot be used here). Installed together in one command so npm
      # resolves a "firebase" version compatible with this plugin's peer
      # dependency itself — pinning "firebase" separately in package.json
      # causes an ERESOLVE conflict here, since the plugin may require a
      # newer major version than whatever got pinned.
      - name: Install Firebase Authentication plugin
        run: npm install @capacitor-firebase/authentication firebase

      # Bundles the Firebase SDK and app fonts into www/vendor/ so the app
      # loads them from disk instead of fetching from gstatic.com /
      # fonts.googleapis.com on every launch. Faster cold start, and the
      # app no longer stalls waiting on those two hosts on a slow/flaky
      # loads fonts from disk instead of fetching from fonts.googleapis.com
      # on every launch — faster cold start, and no stall on a slow/flaky
      # connection. index.html references vendor/fonts/fonts.css directly.
      # (Firebase SDK is intentionally back on CDN for now — bundling it
      # locally pulled in a newer major "firebase" version than the pinned
      # 10.13.0 the CDN used, which appears to have broken Google Sign-In.
      # Revisit bundling it again once that's root-caused separately.)
      - name: Bundle fonts locally (offline / faster load)
        run: |
          mkdir -p www/vendor/fonts
          cat node_modules/@fontsource/inter/500.css \
              node_modules/@fontsource/inter/600.css \
              node_modules/@fontsource/inter/700.css \
              node_modules/@fontsource/inter/800.css \
              node_modules/@fontsource/inter/900.css \
              node_modules/@fontsource/bebas-neue/400.css \
              > www/vendor/fonts/fonts.css
          cp -r node_modules/@fontsource/inter/files www/vendor/fonts/
          cp -r node_modules/@fontsource/bebas-neue/files www/vendor/fonts/

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # Health Connect (step-count → XP) requires minSdkVersion 26+.
      - name: Patch minSdkVersion for Health Connect
        run: bash ci/patch-health.sh

      - name: Add google-services.json and Gradle plugin for Firebase Auth
        run: bash ci/patch-firebase.sh

      - name: Generate app icons from resources/
        run: npx capacitor-assets generate --android

      - name: Sync web assets into Android project
        run: npx cap sync android

      # @capacitor/geolocation's manifest merge has been unreliable here,
      # sometimes leaving the built APK with no location permission
      # declared at all. This guarantees it's present.
      - name: Ensure location permissions are declared
        run: bash ci/patch-location.sh

      - name: Force stable debug signing (keeps app signature stable across builds)
        env:
          CINDY_KEYSTORE_PATH: ${{ github.workspace }}/ci/debug.keystore
        run: bash ci/patch-signing.sh

      - name: Install Android Home Screen Widget
        run: bash ci/patch-widget.sh

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cindy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
